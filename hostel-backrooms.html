<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>New Ekalabya Hostel</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:ui-monospace,Menlo,Consolas,monospace}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:fixed;color:#2b2540;font-size:12px;font-weight:700}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-weight:700;letter-spacing:.1em;z-index:9}
#compass{left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:2px solid #2b2540;background:#fffc;display:flex;align-items:flex-start;justify-content:center}
#needle{position:absolute;left:19px;top:3px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:16px solid #d83a2e;transform-origin:50% 19px}
#compass span{position:absolute;top:-17px;left:0;right:0;text-align:center}
#isoWrap{right:calc(6px + env(safe-area-inset-right));top:calc(20px + env(safe-area-inset-top));width:52px;height:min(140px,26vh)}
#zoomWrap{right:calc(6px + env(safe-area-inset-right));top:calc(20px + min(140px,26vh) + 12px + env(safe-area-inset-top));width:32px;height:min(190px,32vh)}
#isoWrap canvas,#zoomWrap canvas{width:100%;height:100%;display:block;touch-action:none}
#stickZone{left:calc(10px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:164px;height:164px;border-radius:50%;touch-action:none}
#stick{position:absolute;left:20px;top:20px;width:124px;height:124px;border-radius:50%;background:#fff8;border:2px solid #2b2540;pointer-events:none}
#knob{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:#2b2540cc}
.hud button{border-radius:50%;border:2px solid #2b2540;background:#fffd;color:#2b2540;font:700 13px ui-monospace,Menlo,monospace;touch-action:manipulation;padding:0;-webkit-tap-highlight-color:transparent}
#view,#gear{border-radius:8px;width:auto;height:auto;padding:4px 10px;font-size:13px;letter-spacing:.08em;border-width:3px}
#gear{display:flex;align-items:center;justify-content:center}#gear svg{width:22px;height:22px;display:block}
#acts{right:calc(14px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:180px;height:150px}
#acts button{position:absolute}
#jump{right:0;bottom:0;width:88px;height:88px;font-size:15px}
#run{right:98px;bottom:6px;width:74px;height:74px;font-size:14px}
#jump:active{background:#2b2540;color:#fff}
#run.on,#view.on{background:#2b2540;color:#fff}
#topbar{left:calc(68px + env(safe-area-inset-left));top:calc(20px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
#clock{background:#fffc;border:2px solid #2b2540;border-radius:6px;padding:3px 7px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));background:#fffd;border:2px solid #2b2540;border-radius:8px;padding:4px 8px;color:#2b2540;font-size:11px;text-align:center;transition:opacity 1s;pointer-events:none;max-width:70vw}
#panel{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#0008;touch-action:none}
#panel.open{display:flex}
#card{background:#fffffa;border:3px solid #2b2540;border-radius:12px;padding:14px 16px;min-width:250px;color:#2b2540;font:700 13px ui-monospace,Menlo,monospace}
#card h3{margin:0 0 10px;font-size:15px;letter-spacing:.1em}
#card .row{display:flex;align-items:center;gap:8px;margin:8px 0}
#card label{width:78px}
#card select,#card button{font:700 14px ui-monospace,Menlo,monospace;color:#2b2540;background:#fff;border:2px solid #2b2540;border-radius:8px;padding:6px 8px;touch-action:manipulation}
#card button.on{background:#2b2540;color:#fff}
#card .done{width:100%;margin-top:6px}
#card{width:min(86vw,340px);min-width:0;box-sizing:border-box}
#card h3{padding-bottom:6px;border-bottom:2px solid #2b2540}
#card .tabs{display:flex;gap:6px;margin:0 0 8px}
#card .tabs button{padding:5px 9px;font-size:12px;letter-spacing:.06em;border-radius:6px}
#card .pane{display:none;min-height:150px}
#card .pane.on{display:block}
#card #chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#card .chr{padding:0;border:3px solid #2b2540;border-radius:8px;background:#fff;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
#card .chr img{display:block;width:100%;aspect-ratio:400/470;object-fit:cover;image-rendering:auto;pointer-events:none}
#card .chr span{display:block;padding:4px 0;font-size:12px;letter-spacing:.06em;text-align:center;background:#fffffa;color:#2b2540}
#card .chr.on{border-color:#e0a31a;box-shadow:0 0 0 2px #2b2540}
#card .chr.on span{background:#2b2540;color:#fff}
#card button.chr.on{background:#fff}
</style></head><body>

    const eU=ex*f.ux+ey*f.uy+ez*f.uz,eV=ex*f.vx+ey*f.vy+ez*f.vz;
    const fU=fX*f.ux+fY*f.uy+fZ*f.uz,rU=rX*f.ux+rY*f.uy,cU=uX*f.ux+uY*f.uy+uZ*f.uz;
    const fV=fX*f.vx+fY*f.vy+fZ*f.vz,rV=rX*f.vx+rY*f.vy,cV=uX*f.vx+uY*f.vy+uZ*f.vz;
    const tex=f.tex,tw=f.tw,th=f.th,bias=f.bias;
    for(let iy=iy0;iy<=iy1;iy++){
      const ys=(iy+.5-OY)/FL,row=iy*W;
      for(let ix=ix0;ix<=ix1;ix++){
        const xs=(ix+.5-OX)/FL,den=n0+xs*nr-ys*nu;
        if(den>-1e-6&&den<1e-6)continue;
        const t=-nd/den;if(t<NEAR)continue;
        const a=(eU+t*(fU+xs*rU-ys*cU))/uu,b=(eV+t*(fV+xs*rV-ys*cV))/vv;
        if(a<-.003||a>1.003||b<-.003||b>1.003)continue;
        let ti=(a*tw)|0,tj=(b*th)|0;if(ti<0)ti=0;else if(ti>=tw)ti=tw-1;if(tj<0)tj=0;else if(tj>=th)tj=th-1;
        const c=tex[tj*tw+ti];if(!c)continue;
        const d=-t+bias,i=row+ix;if(d<=zb[i])continue;
        if(gh){if(d<=zg[i])continue;zg[i]=d;gpx[i]=c;}else{zb[i]=d;pix[i]=c;}
      }
    }
  }
}

/* ---------- day / night cycle: 12 game hours = 15 real minutes (1 game hour = 75 s) ---------- */
const LK=[[0,.26,.3,.5],[4.5,.28,.32,.52],[5.5,.62,.52,.68],[6.5,1,.74,.6],[8,1,.95,.86],[10,1,1,1],[15.5,1,.98,.94],[17.5,1,.82,.62],[18.5,1,.56,.44],[19.5,.46,.38,.6],[20.5,.28,.32,.52],[24,.26,.3,.5]];
const SK=[[0,14,18,40,4,6,20],[4.5,18,22,52,6,8,26],[5.5,120,90,120,30,40,90],[6.5,255,170,110,90,120,185],[8,200,215,235,90,150,225],[10,190,222,248,70,140,226],[15.5,190,215,240,76,140,222],[17.5,255,190,120,96,120,190],[18.5,255,110,70,60,60,120],[19.5,90,60,100,22,22,60],[20.5,18,22,52,6,8,26],[24,14,18,40,4,6,20]];
function keyAt(A,h){
  for(let i=0;i<A.length-1;i++){
    const a=A[i],b=A[i+1];
    if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]),o=[];for(let k=1;k<a.length;k++)o.push(a[k]+(b[k]-a[k])*t);return o;}
  }
  return A[0].slice(1);
}
function finish(){
  const k=keyAt(LK,gt),kr=Math.min(256,k[0]*256)|0,kg=Math.min(256,k[1]*256)|0,kb=Math.min(256,k[2]*256)|0;
  const sk=keyAt(SK,gt),night=clamp((.62-(k[0]+k[1]+k[2])/3)/.3,0,1),tint=!(kr>=256&&kg>=256&&kb>=256);
  const hz=FP?OY+FL*Math.tan(cam.pitch):0;
  for(let iy=0;iy<H;iy++){
    let sr=0,sg=0,sb=0;
    if(FP){const q=clamp((hz-iy)/(H*.7),0,1);sr=sk[0]+(sk[3]-sk[0])*q;sg=sk[1]+(sk[4]-sk[1])*q;sb=sk[2]+(sk[5]-sk[2])*q;}
    const row=iy*W;
    for(let ix=0;ix<W;ix++){
      const i=row+ix;
      if(zb[i]<-1e8){
        if(!FP)continue;
        if(inC){pix[i]=0xFF000000;continue;}
        if(night>.05&&iy<hz&&(((ix*73856093)^(iy*19349663))>>>0)%611===0){const v=210*night;pix[i]=rgb(v,v,v);}
        else pix[i]=rgb(sr,sg,sb);
        continue;
      }
      if(tint){const c=pix[i];pix[i]=(255<<24|(((c>>16&255)*kb)>>8)<<16|(((c>>8&255)*kg)>>8)<<8|(((c&255)*kr)>>8))>>>0;}
    }
  }
  if(ghost1||curZ>=0){ // faded portico / dimmed neighbouring rooms: blend the nearest ghost surface over the scene
    const rf=curZ>=0,A=rf?.72:.4,B=1-A,DIM=rf?.85:1;
    for(let i=0;i<W*H;i++){
      const z=zg[i];if(z<-1e8||z<=zb[i])continue;
      let g=gpx[i];
      if(tint)g=(255<<24|(((g>>16&255)*kb)>>8)<<16|(((g>>8&255)*kg)>>8)<<8|(((g&255)*kr)>>8))>>>0;
      if(DIM<1)g=(255<<24|(((g>>16&255)*DIM)|0)<<16|(((g>>8&255)*DIM)|0)<<8|(((g&255)*DIM)|0))>>>0;
      const u=pix[i];
      pix[i]=(255<<24|(((u>>16&255)*B+(g>>16&255)*A)|0)<<16|(((u>>8&255)*B+(g>>8&255)*A)|0)<<8|(((u&255)*B+(g&255)*A)|0))>>>0;
      if(zb[i]<-1e8)zb[i]=z;
    }
  }
  if(FP&&!inC){ // sun by day, moon by night
    const sun=gt>=6&&gt<18,tt=sun?(gt-6)/12:((gt<6?gt+24:gt)-18)/12,el=Math.sin(tt*Math.PI)*1.25,th=tt*Math.PI;
    let hx=Math.cos(th),hy=.45;const hl=Math.hypot(hx,hy);hx/=hl;hy/=hl;
    const dx=hx*Math.cos(el),dy=hy*Math.cos(el),dz=Math.sin(el),zc=dx*fX+dy*fY+dz*fZ;
    if(zc>.05){
      const cx=OX+(dx*rX+dy*rY)/zc*FL,cy=OY-(dx*uX+dy*uY+dz*uZ)/zc*FL,R=Math.max(3,FL*(sun?.045:.035)),col=sun?rgb(255,240,180):rgb(226,232,250);
      for(let iy=Math.max(0,Math.floor(cy-R));iy<=Math.min(H-1,Math.ceil(cy+R));iy++)for(let ix=Math.max(0,Math.floor(cx-R));ix<=Math.min(W-1,Math.ceil(cx+R));ix++){
        const i=iy*W+ix;if(zb[i]>-1e8)continue;
        if((ix-cx)*(ix-cx)+(iy-cy)*(iy-cy)<=R*R)pix[i]=col;
      }
    }
  }
}
const clockEl=document.getElementById('clock');let lastMin=-1;
function updateClock(){
  const mm=Math.floor(gt*60);if(mm===lastMin)return;lastMin=mm;
  const h=Math.floor(gt),m=Math.floor((gt-h)*60);
  const h12=h%12||12;clockEl.textContent=(h12<10?'0':'')+h12+':'+(m<10?'0':'')+m+' '+(h<12?'AM':'PM')+' '+(gt>=5&&gt<7?'DAWN':gt>=7&&gt<17?'DAY':gt>=17&&gt<19?'DUSK':'NIGHT');
}

/* ---------- render ---------- */
function render(){
  S=cam.S;cosY=Math.cos(cam.yaw);sinY=Math.sin(cam.yaw);ce=Math.cos(cam.el);se=Math.sin(cam.el);PX=pl.x;PY=pl.y;OZ=pl.z+1.3;
  zb.fill(-1e9);
  const in4=inInt(pl.x,pl.y);inC=in4;
  hidden[3]=in4;
  hidden[1]=in4;ghost1=!in4&&pl.x>32&&pl.x<45.9&&pl.y>52.4-RECD&&pl.y<61.8;  // under the portico: fade it instead of hiding it
  curZ=(in4&&!FP&&ZI)?ZI(pl.x,pl.y):-1;   // orbit view indoors: focus on the room/hall the player is in
  if(ghost1||curZ>=0)zg.fill(-1e9);
  hidden[2]=pl.x>33.3&&pl.x<46.3&&pl.y>70&&pl.y<77;
  if(FP){setupFP();drawGroundFP();drawFacesFP();if(ghost1)drawFacesFP(true);if(!in4){drawProps(windT);drawTufts(windT);}drawWatcher();}
  else{drawGround();drawFaces();if(ghost1||curZ>=0)drawFaces(true);if(!in4)drawProps(windT);shadeEdges();if(!in4)drawTufts(windT);playerShadow();pm.fill(0);drawPlayer();drawWatcher();}
  finish();updateClock();
  ctx.putImageData(img,0,0);
  needle.style.transform='rotate('+Math.atan2(-sinY,cosY)*180/Math.PI+'deg)';
}

/* ---------- UI ---------- */
const needle=document.getElementById('needle'),dialEl=document.getElementById('dial'),zoomEl=document.getElementById('zoomC');
const D2R=Math.PI/180,EL0=10,EL1=80,ISO_K=3.2,S0Z=4,S1Z=22;
function sizeCv(c){const dpr=window.devicePixelRatio||1,r=c.getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(c.width!==w*dpr||c.height!==h*dpr){c.width=w*dpr;c.height=h*dpr;}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);return {g,w,h};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
/* ISO: vertical ruler dial, ticks scroll behind a fixed red marker */
function updateDial(){
  const {g,w,h}=sizeCv(dialEl),deg=cam.el/D2R,cy=h/2+6;
  g.save();rr(g,2,2,w-4,h-4,9);g.fillStyle='rgba(255,255,255,.88)';g.fill();g.clip();
  g.strokeStyle='#2b2540';g.fillStyle='#2b2540';g.lineWidth=2;
  for(let d=EL0;d<=EL1;d++){
    const y=cy+(d-deg)*ISO_K;
    if(y<22||y>h-4)continue;
    const L=d%10===0?15:d%5===0?10:5;
    g.beginPath();g.moveTo(3,y);g.lineTo(3+L,y);g.moveTo(w-3,y);g.lineTo(w-3-L,y);g.stroke();
  }
  g.fillStyle='rgba(255,255,255,.92)';g.fillRect(2,2,w-4,20);
  g.fillStyle='#2b2540';g.font='700 11px ui-monospace,Menlo,monospace';g.textAlign='center';g.fillText('ISO',w/2,16);
  g.fillStyle='rgba(255,255,255,.95)';rr(g,10,cy-10,w-20,20,6);g.fill();
  g.fillStyle='#d83a2e';g.fillRect(2,cy-2,9,4);g.fillRect(w-11,cy-2,9,4);
  g.font='italic 700 14px ui-monospace,Menlo,monospace';g.textBaseline='middle';g.fillText(Math.round(deg)+'\u00b0',w/2,cy+1);
  g.restore();
  g.strokeStyle='#2b2540';g.lineWidth=3;rr(g,2,2,w-4,h-4,9);g.stroke();
}
let isoDrag=null;
dialEl.addEventListener('pointerdown',e=>{isoDrag={y:e.clientY,el:cam.el/D2R};dialEl.setPointerCapture(e.pointerId);e.preventDefault();});
dialEl.addEventListener('pointermove',e=>{if(isoDrag)setEl((isoDrag.el+(e.clientY-isoDrag.y)/ISO_K)*D2R);});
const isoEnd=()=>{isoDrag=null;};
dialEl.addEventListener('pointerup',isoEnd);dialEl.addEventListener('pointercancel',isoEnd);
dialEl.addEventListener('wheel',e=>{setEl(cam.el+(e.deltaY>0?-1:1)*3*D2R);e.preventDefault();},{passive:false});

/* ZOOM: vertical slider (+ top, - bottom) - the only zoom control */
let lastZ=-1;
function drawZoom(force){
  if(!force&&lastZ===cam.S)return;lastZ=cam.S;
  const {g,w,h}=sizeCv(zoomEl),t=Math.log(cam.S/S0Z)/Math.log(S1Z/S0Z),y0=30,y1=h-30,ky=y1-(y1-y0)*clamp(t,0,1);
  rr(g,2,2,w-4,h-4,9);g.fillStyle='rgba(255,255,255,.88)';g.fill();g.strokeStyle='#2b2540';g.lineWidth=3;g.stroke();
  g.fillStyle='#d83a2e';g.font='700 18px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('+',w/2,15);
  g.fillStyle='#2b2540';g.fillText('\u2212',w/2,h-15);
  rr(g,w/2-4,y0-4,8,y1-y0+8,4);g.fillStyle='#fff';g.fill();g.lineWidth=2;g.stroke();
  g.beginPath();g.arc(w/2,ky,10,0,7);g.fillStyle='#cfc9dc';g.fill();g.lineWidth=3;g.stroke();
}
let zoomDrag=false;
function zoomPoint(e){const r=zoomEl.getBoundingClientRect(),y0=30,y1=r.height-30,t=clamp((y1-(e.clientY-r.top))/(y1-y0),0,1);cam.S=S0Z*Math.pow(S1Z/S0Z,t);drawZoom();}
zoomEl.addEventListener('pointerdown',e=>{zoomDrag=true;zoomEl.setPointerCapture(e.pointerId);zoomPoint(e);e.preventDefault();});
zoomEl.addEventListener('pointermove',e=>{if(zoomDrag)zoomPoint(e);});
const zEnd=()=>{zoomDrag=false;};
zoomEl.addEventListener('pointerup',zEnd);zoomEl.addEventListener('pointercancel',zEnd);
zoomEl.addEventListener('wheel',e=>{cam.S=clamp(cam.S*(e.deltaY>0?.9:1.1),S0Z,S1Z);drawZoom();e.preventDefault();},{passive:false});

const stickZone=document.getElementById('stickZone'),stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-8;
  let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R;
}
stickZone.addEventListener('pointerdown',e=>{stickId=e.pointerId;stickZone.setPointerCapture(e.pointerId);stickMove(e);e.preventDefault();});
stickZone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';};
stickZone.addEventListener('pointerup',stickEnd);stickZone.addEventListener('pointercancel',stickEnd);

const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const drag=(dx,dy)=>{if(FP){cam.yaw+=dx*.006;cam.pitch=clamp(cam.pitch-dy*.005,-1.3,1.3);}else cam.yaw+=dx*.008;};
let gest=null,tprev=new Map();
const gInfo=(a,b)=>({d:Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY)||1,ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)});
const tPos=l=>{tprev=new Map([...l].map(t=>[t.identifier,{x:t.clientX,y:t.clientY}]));};
const tSync=l=>{tPos(l);if(l.length===2){const i=gInfo(l[0],l[1]);gest={mode:null,d0:i.d,a0:i.ang,S0:cam.S,yaw0:cam.yaw};}else gest=null;};
cv.style.touchAction='none';
cv.addEventListener('touchstart',e=>{tSync(e.targetTouches);e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{
  const l=e.targetTouches;
  if(l.length===1){const p=tprev.get(l[0].identifier);if(p)drag(l[0].clientX-p.x,l[0].clientY-p.y);}
  else if(l.length===2&&gest){
    const i=gInfo(l[0],l[1]),dd=Math.abs(i.d-gest.d0),da=wrapA(i.ang-gest.a0),arc=Math.abs(da)*gest.d0/2;
    if(!gest.mode&&arc>14&&arc>dd)gest.mode='rot';
    if(gest.mode==='rot')cam.yaw=gest.yaw0-da;
  }
  tPos(l);e.preventDefault();
},{passive:false});
const tEnd=e=>{tSync(e.targetTouches);e.preventDefault();};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
let md=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){md={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{if(md&&e.pointerType==='mouse'){drag(e.clientX-md.x,e.clientY-md.y);md={x:e.clientX,y:e.clientY};}});
cv.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')md=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{if(document.getElementById('panel').classList.contains('open'))return;keys[e.key.toLowerCase()]=true;if(e.key==='Shift')keys.shift=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(!e.repeat){if(e.key==='v')setFP(!FP);if(e.key==='t')gt=(gt+1)%24;}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')keys.shift=false;});
const viewBtn=document.getElementById('view');
function setFP(v){FP=v;viewBtn.classList.toggle('on',FP);viewBtn.textContent=FP?'TPP':'FPP';document.getElementById('isoWrap').style.display=FP?'none':'';if(FP)cam.pitch=0;}
viewBtn.onclick=()=>setFP(!FP);
/* ---------- settings: time of day (12h + AM/PM) and character ---------- */
{ const panel=document.getElementById('panel'),sH=document.getElementById('sH'),sM=document.getElementById('sM'),bAM=document.getElementById('sAM'),bPM=document.getElementById('sPM');
  for(let i=1;i<=12;i++)sH.add(new Option(i<10?'0'+i:''+i,i));
  for(let i=0;i<60;i++)sM.add(new Option(i<10?'0'+i:''+i,i));
  let pm=true;
  const showAP=()=>{bAM.classList.toggle('on',!pm);bPM.classList.toggle('on',pm);};
  const fromClock=()=>{const h=Math.floor(gt);pm=h>=12;sH.value=h%12||12;sM.value=Math.floor((gt-h)*60);showAP();};
  const apply=()=>{const h=(+sH.value%12)+(pm?12:0);gt=h+(+sM.value)/60;lastMin=-1;};
  document.getElementById('gear').onclick=()=>{fromClock();panel.classList.add('open');for(const k in keys)keys[k]=false;joy.x=0;joy.y=0;};
  document.getElementById('sDone').onclick=()=>panel.classList.remove('open');
  document.querySelectorAll('#card .tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('#card .tab').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('#card .pane').forEach(p=>p.classList.toggle('on',p.id===t.dataset.t));});
  { let selChar=null;const cb=[...document.querySelectorAll('#chars .chr')];
    cb.forEach(b=>b.onclick=()=>{selChar=selChar===b.dataset.n?null:b.dataset.n;cb.forEach(x=>x.classList.toggle('on',x.dataset.n===selChar));window.selectedCharacter=selChar;}); }
  sH.onchange=sM.onchange=apply;
  bAM.onclick=()=>{pm=false;showAP();apply();};bPM.onclick=()=>{pm=true;showAP();apply();};
}
const runBtn=document.getElementById('run');
runBtn.onclick=()=>{runToggle=!runToggle;runBtn.classList.toggle('on',runToggle);};
const jb=document.getElementById('jump');
jb.addEventListener('pointerdown',e=>{jumpBtn=true;jb.setPointerCapture(e.pointerId);e.preventDefault();});
const jbEnd=()=>{jumpBtn=false;};
jb.addEventListener('pointerup',jbEnd);jb.addEventListener('pointercancel',jbEnd);jb.addEventListener('lostpointercapture',jbEnd);
addEventListener('resize',()=>{resize();updateDial();drawZoom(true);});

function init(){
  resize();buildScene();tagInterior();updateDial();drawZoom(true);
  document.getElementById('loading').style.display='none';
  setTimeout(()=>{document.getElementById('hint').style.opacity=0;},9000);
  let last=0;
  const loop=ts=>{const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;gt=(gt+dt/75)%24;windT=Math.floor(T*8)/8;update(dt);render();drawZoom();requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
setTimeout(init,40);
</script></body></html>
